name: qep-backend quality gates

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet restore Backend.slnx --locked-mode
      - run: dotnet build Backend.slnx --configuration Release --no-restore
      - run: dotnet test Backend.slnx --configuration Release --no-build
