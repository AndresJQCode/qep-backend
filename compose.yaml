name: qep-local

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: qep
      POSTGRES_USER: qep
      POSTGRES_PASSWORD: qep_dev
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qep -d qep"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - qep-postgres:/var/lib/postgresql

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.155.0
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    volumes:
      - ./ops/otel-collector.yaml:/etc/otelcol-contrib/config.yaml:ro
    ports:
      - "4317:4317"
      - "4318:4318"
      - "8889:8889"

volumes:
  qep-postgres:
