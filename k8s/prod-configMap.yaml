apiVersion: v1
kind: ConfigMap
metadata:
  name: qep-backend-config
  namespace: prod-qep-backend
  labels:
    app.kubernetes.io/name: qep-backend
    app.kubernetes.io/part-of: qep
    app.kubernetes.io/environment: prod
# Únicamente el delta por entorno. appsettings.json viaja dentro de la imagen y sigue
# siendo la línea base versionada de valores por defecto; las variables de entorno tienen
# precedencia sobre él, así que una clave que sólo repita el valor por defecto no va acá:
# quedaría desactualizada en cuanto ese valor cambie en el repositorio. Las credenciales
# viven en prod-secret.yaml, nunca en este ConfigMap: su contenido es texto plano para
# cualquiera que pueda leer ConfigMaps en el namespace.
data:
  ASPNETCORE_ENVIRONMENT: "Production"
  # El publicador del outbox y los tres relays del inbox consultan cada 2-3s, y EF Core
  # registra cada comando en nivel Information, así que el nivel por defecto inunda el pod
  # de líneas "Executed DbCommand" incluso cuando no hay nada que procesar. Subir esta
  # categoría a Warning mantiene visibles los fallos de SQL y elimina el ruido del sondeo.
  # Queda fuera de appsettings.json a propósito: las ejecuciones locales sí muestran SQL.
  Logging__LogLevel__Microsoft.EntityFrameworkCore.Database.Command: "Warning"
  # Variables OTLP estándar que el exportador del SDK lee directamente, no a través de
  # IConfiguration — ver src/BuildingBlocks/BuildingBlocks.Observability/QepObservability.cs.
  # No definir OpenTelemetry__Endpoint acá: tendría precedencia sobre estas.
  OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector.monitoring.svc.cluster.local:4317"
  OTEL_SERVICE_NAME: "qep-backend"
  OTEL_RESOURCE_ATTRIBUTES: "service.namespace=qep"
  # Authentication__Authority queda sin definir: por defecto toma el emisor propio de
  # Google (https://accounts.google.com) en QepServiceCollectionExtensions.AddAuthentication.
  # Sólo la audiencia (el client id de OAuth de Google) debe proveerse por entorno.
  Authentication__Audience: "#{AUTHENTICATION_GOOGLE_CLIENT_ID}#"
  # Repite el valor por defecto de la imagen a propósito: que un visitante anónimo pueda
  # crear un tenant es una decisión de seguridad, y producción la declara de forma
  # explícita en lugar de heredarla en silencio.
  Registration__PublicTenantSignupEnabled: "true"
  Notifications__InvitationUrl: "#{NOTIFICATIONS_INVITATION_URL}#"
  Notifications__Infobip__BaseUrl: "#{NOTIFICATIONS_INFOBIP_BASE_URL}#"
  Notifications__Infobip__SenderEmail: "#{NOTIFICATIONS_INFOBIP_SENDER_EMAIL}#"
  # Identificadores, no credenciales. El par de claves de R2 está en prod-secret.yaml.
  Storage__R2__AccountId: "#{STORAGE_R2_ACCOUNT_ID}#"
  Storage__R2__Bucket: "#{STORAGE_R2_BUCKET}#"
  Storage__R2__PublicBucket: "#{STORAGE_R2_PUBLIC_BUCKET}#"
  Storage__R2__PublicBaseUrl: "#{STORAGE_R2_PUBLIC_BASE_URL}#"
  Storage__R2__Endpoint: "#{STORAGE_R2_ENDPOINT}#"
  # Id de la plantilla de WhatsApp aprobada por Meta. Repite el valor por defecto de la imagen
  # y aun así va acá: cambiar el texto del mensaje es una decisión de negocio que no toca una
  # línea de código, pero Meta no permite editar una plantilla aprobada — hay que crear otra y
  # apuntar a su id. Sin esta clave, ese cambio exigiría reconstruir y desplegar la imagen.
  # El token y el número emisor son credenciales y viven en prod-secret.yaml.
  Quotations__WhatsApp__TemplateId: "#{QUOTATIONS_WHATSAPP_TEMPLATE_ID}#"
