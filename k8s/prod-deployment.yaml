apiVersion: apps/v1
kind: Deployment
metadata:
  name: #{APP_NAME}#
  namespace: prod-#{APP_NAME}#
  labels:
    app.kubernetes.io/name: #{APP_NAME}#
    app.kubernetes.io/part-of: qep
    app.kubernetes.io/environment: prod
spec:
  replicas: 1
  revisionHistoryLimit: 5
  minReadySeconds: 5
  selector:
    matchLabels:
      app: #{APP_NAME}#
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: #{APP_NAME}#
        app.kubernetes.io/name: #{APP_NAME}#
        app.kubernetes.io/part-of: qep
        app.kubernetes.io/environment: prod
    spec:
      imagePullSecrets:
        - name: regcred
      # 45 s y no el default de 30: el preStop consume 10, y al apagado del host le quedan 35, más que el
      # ShutdownTimeout por defecto de .NET (30 s; el repo no lo cambia). Lo verifica ShutdownBudgetTests.
      terminationGracePeriodSeconds: 45
      # DNS (incidente 2026-11-19, ver migracion-k8s docs/12-bitacora-incidencias.md): con ndots:5
      # cada nombre del cluster (pg-platform-pooler-rw.database.svc.cluster.local, valkey...) generaba
      # ~8 consultas antes de resolver, y una sola perdida costaba 5 s; el health check de la base
      # (corte 2 s) fallaba y el pod salía del Service con 503. ndots:2 resuelve esos FQDN al primer
      # intento; single-request-reopen evita la carrera de conntrack de glibc con A/AAAA en paralelo.
      # Ya se aplicó en el cluster con kubectl patch; aquí queda para que ningún deploy lo pierda.
      dnsConfig:
        options:
          - name: ndots
            value: "2"
          - name: single-request-reopen
      containers:
        - name: #{APP_NAME}#
          image: index.docker.io/qcodeco/prod-#{APP_NAME}#:TAG
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          # El ingress sigue mandando requests al pod que se apaga hasta que su endpoint sale del Service; sin esta
          # espera, los webhooks de Meta y Shopify que caen ahí reciben 502. 10 s antes del SIGTERM los cubren, y
          # después el host tiene su ShutdownTimeout para que los workers terminen lo que tienen en curso.
          # La imagen aspnet es Debian y trae sleep.
          lifecycle:
            preStop:
              exec:
                command: ["sleep", "10"]
          # Dos fuentes, sin claves superpuestas: el ConfigMap lleva el delta por entorno
          # no sensible, el Secret lleva las credenciales. Ante una colisión de claves
          # gana la fuente posterior, por eso el Secret va segundo a propósito.
          envFrom:
            - configMapRef:
                name: #{APP_NAME}#-config
            - secretRef:
                name: #{APP_NAME}#-secret
          # 180 s (36 intentos cada 5 s; spec 2026-10-29 de réplicas múltiples, D-3). Sólo cuenta hasta
          # el primer éxito: después mandan la liveness y la readiness. Cubre dos arranques seguidos,
          # porque con el candado de arranque (D-2) un segundo pod espera a que el primero termine de
          # migrar y sembrar antes de hacer lo suyo. Se reajusta con el log 4109 (cuánto tardó el
          # bloque): si en producción pasa de 60 s, toca volver a la alternativa del Job de migración.
          startupProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 5
            failureThreshold: 36
          # La readiness mira la base (/health/ready): un pod sin conexión sale del Service
          # sin reiniciarse. startup y liveness se quedan en /health/live, que no la toca:
          # si dependieran de ella, una caída de la base reiniciaría todos los pods en cadena.
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 6
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
