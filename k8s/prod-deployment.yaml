apiVersion: apps/v1
kind: Deployment
metadata:
  name: #{APP_NAME}#
  namespace: prod-#{APP_NAME}#
  labels:
    app.kubernetes.io/name: #{APP_NAME}#
    app.kubernetes.io/part-of: qep
    app.kubernetes.io/environment: prod
spec:
  replicas: 1
  revisionHistoryLimit: 5
  minReadySeconds: 5
  selector:
    matchLabels:
      app: #{APP_NAME}#
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: #{APP_NAME}#
        app.kubernetes.io/name: #{APP_NAME}#
        app.kubernetes.io/part-of: qep
        app.kubernetes.io/environment: prod
    spec:
      imagePullSecrets:
        - name: regcred
      containers:
        - name: #{APP_NAME}#
          image: index.docker.io/qcodeco/prod-#{APP_NAME}#:TAG
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          # Dos fuentes, sin claves superpuestas: el ConfigMap lleva el delta por entorno
          # no sensible, el Secret lleva las credenciales. Ante una colisión de claves
          # gana la fuente posterior, por eso el Secret va segundo a propósito.
          envFrom:
            - configMapRef:
                name: #{APP_NAME}#-config
            - secretRef:
                name: #{APP_NAME}#-secret
          startupProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 5
            failureThreshold: 12
          readinessProbe:
            httpGet:
              path: /health/live
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 6
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              cpu: 500m
              memory: 1Gi
