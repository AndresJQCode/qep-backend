apiVersion: v1
kind: Namespace
metadata:
  name: prod-qep-backend
  labels:
    app.kubernetes.io/name: qep-backend
    app.kubernetes.io/part-of: qep
    app.kubernetes.io/environment: prod
    # La NetworkPolicy de Valkey sólo admite namespaces con esta etiqueta: sin ella, la conexión da timeout (DP-V4).
    valkey.platform/access: "true"
