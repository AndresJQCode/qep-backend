# Al drenar un nodo, Kubernetes no desaloja un pod si con eso quedan menos de uno disponible.
# Pensado para replicas: 2 (plan 2026-09-24, tarea 6): el drain saca un pod y espera a que el
# otro quede listo antes de tocar el segundo. Ojo mientras siga en replicas: 1: el drain
# voluntario queda BLOQUEADO (el maxSurge sólo aplica a rollouts, no a desalojos), así que para
# drenar el nodo antes hay que escalar a 2 a mano. Los rollouts no se ven afectados.
# Mismo selector que el Deployment (prod-deployment.yaml).
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: #{APP_NAME}#
  namespace: prod-#{APP_NAME}#
  labels:
    app.kubernetes.io/name: #{APP_NAME}#
    app.kubernetes.io/part-of: qep
    app.kubernetes.io/environment: prod
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: #{APP_NAME}#
