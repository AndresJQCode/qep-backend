apiVersion: v1
kind: Secret
metadata:
  name: qep-backend-secret
  namespace: prod-qep-backend
  labels:
    app.kubernetes.io/name: qep-backend
    app.kubernetes.io/part-of: qep
    app.kubernetes.io/environment: prod
type: Opaque
# Sólo credenciales. Antes estaban en prod-configMap.yaml, donde cualquier principal con
# permiso get sobre ConfigMaps podía leerlas y `kubectl describe pod` imprimía sus valores.
#
# Un Secret de Kubernetes es base64, no cifrado: es una frontera, no una bóveda. Lo que
# aporta es real pero acotado — RBAC separado, sin exposición accidental por volcados de
# ConfigMap ni por la descripción de un pod, y la costura donde más adelante se enchufan
# sealed-secrets o external-secrets sin que la aplicación cambie.
#
# Los valores de abajo son tokens de reemplazo del pipeline. Tras la sustitución este
# manifiesto contiene credenciales reales: nunca debe volcarse a un log de build ni
# persistirse como artefacto.
stringData:
  # Cadena de conexión ADO.NET completa, provista como una sola variable. Acá no puede
  # componerse a partir de partes sueltas de host/puerto/usuario: la expansión $(VAR) de
  # k8s sólo resuelve variables declaradas en el bloque "env" del propio contenedor, nunca
  # claves que llegan por envFrom. La contraseña es la razón por la que esta clave vive en
  # un Secret.
  ConnectionStrings__QepDatabase: "#{DATABASE_CONNECTION_STRING}#"
  Notifications__Infobip__ApiKey: "#{NOTIFICATIONS_INFOBIP_API_KEY}#"
  # Zenvia, para el envío de la cotización por WhatsApp. El número emisor va acá y no en el
  # ConfigMap porque identifica la línea de WhatsApp Business de la empresa: no abre nada por
  # sí solo, pero tampoco es un dato que tenga que poder leer cualquiera con `get` sobre
  # ConfigMaps. Sin estas dos, AddWhatsAppSender registra LogWhatsAppSender y el envío pasa a
  # ser un log: el endpoint responde 200 y el cliente nunca recibe nada.
  Quotations__WhatsApp__ApiToken: "#{QUOTATIONS_WHATSAPP_API_TOKEN}#"
  Quotations__WhatsApp__FromNumber: "#{QUOTATIONS_WHATSAPP_FROM_NUMBER}#"
  Storage__R2__AccessKeyId: "#{STORAGE_R2_ACCESS_KEY_ID}#"
  Storage__R2__SecretAccessKey: "#{STORAGE_R2_SECRET_ACCESS_KEY}#"
