apiVersion: v1
kind: Secret
metadata:
  name: qep-backend-secret
  namespace: prod-qep-backend
  labels:
    app.kubernetes.io/name: qep-backend
    app.kubernetes.io/part-of: qep
    app.kubernetes.io/environment: prod
type: Opaque
# Sólo credenciales. Antes estaban en prod-configMap.yaml, donde cualquier principal con
# permiso get sobre ConfigMaps podía leerlas y `kubectl describe pod` imprimía sus valores.
#
# Un Secret de Kubernetes es base64, no cifrado: es una frontera, no una bóveda. Lo que
# aporta es real pero acotado — RBAC separado, sin exposición accidental por volcados de
# ConfigMap ni por la descripción de un pod, y la costura donde más adelante se enchufan
# sealed-secrets o external-secrets sin que la aplicación cambie.
#
# Los valores de abajo son tokens de reemplazo del pipeline. Tras la sustitución este
# manifiesto contiene credenciales reales: nunca debe volcarse a un log de build ni
# persistirse como artefacto.
stringData:
  # Cadena de conexión ADO.NET completa, provista como una sola variable. Acá no puede
  # componerse a partir de partes sueltas de host/puerto/usuario: la expansión $(VAR) de
  # k8s sólo resuelve variables declaradas en el bloque "env" del propio contenedor, nunca
  # claves que llegan por envFrom. La contraseña es la razón por la que esta clave vive en
  # un Secret.
  ConnectionStrings__QepDatabase: "#{DATABASE_CONNECTION_STRING}#"
  ConnectionStrings__QepDatabaseListener: "#{DATABASE_LISTENER_CONNECTION_STRING}#"
  # Cadena de StackExchange.Redis hacia Valkey (spec 2026-11-13, D-1). Lleva la contraseña del usuario ACL
  # qep, y por eso vive acá y no en el ConfigMap. ValkeyOptionsValidator la exige en Production aunque
  # todas las áreas estén apagadas. Variable secreta VALKEY_CONNECTION_STRING del grupo Backend-prod.
  ConnectionStrings__Valkey: "#{VALKEY_CONNECTION_STRING}#"
  Notifications__Infobip__ApiKey: "#{NOTIFICATIONS_INFOBIP_API_KEY}#"
  # Credencial del servicio de generación de PDF (qcode-pdf). No tiene fallback: sin ella el
  # servicio responde 401 y ninguna cotización puede enviarse. QuotationsOptionsValidator la
  # exige en Production con ValidateOnStart, así que su ausencia no degrada el envío — impide
  # que el pod arranque, que es el comportamiento buscado. La URL base no es secreta y vive en
  # prod-configMap.yaml.
  Quotations__Pdf__ApiKey: "#{QUOTATIONS_PDF_API_KEY}#"
  # Una sola clave de qcode-pdf para todo el backend de QEP (decisión del owner, 2026-11-17): Soporte y Compras leen el mismo
  # token que cotizaciones. Las claves viven todas en este pod, así que separarlas no aislaba nada y cada variable más era otra
  # forma de que el pod no arranque. Cada módulo conserva su sección y su validador (ValidateOnStart en Production); un token sin
  # resolver cuenta como ausente: sin QUOTATIONS_PDF_API_KEY en el grupo Backend-prod el pod no arranca.
  Support__Pdf__ApiKey: "#{QUOTATIONS_PDF_API_KEY}#"
  Purchases__Pdf__ApiKey: "#{QUOTATIONS_PDF_API_KEY}#"
  # Spec 2026-10-08 (Integraciones): llave AES-256 (32 bytes en base64) que cifra las credenciales de
  # las conexiones de cada tenant. El valor vive en la variable secreta
  # INTEGRATIONS_SECRET_PROTECTION_KEY_K1 del grupo Backend-prod, con copia en la bóveda del owner.
  # Sin ella, SecretProtectionOptionsValidator deja el pod en crash-loop, a propósito. No se edita con
  # kubectl: el pipeline vuelve a aplicar este manifiesto en cada deploy.
  Integrations__SecretProtection__Keys__k1: "#{INTEGRATIONS_SECRET_PROTECTION_KEY_K1}#"
  # Spec 2026-10-09 (Mensajería): el app secret canjea el code de Embedded Signup y firma el webhook; el
  # token verifica la suscripción del webhook (aleatorio, 32+ caracteres; el mismo valor se pega en Meta).
  # Variables secretas del grupo Backend-prod: META_APP_SECRET y META_WEBHOOK_VERIFY_TOKEN.
  Meta__App__AppSecret: "#{META_APP_SECRET}#"
  Meta__App__WebhookVerifyToken: "#{META_WEBHOOK_VERIFY_TOKEN}#"
  # Spec 2026-10-14 (Instagram): el app secret del caso de uso Instagram canjea el code de Business Login y refresca
  # el token de cada cuenta. Variable secreta del grupo Backend-prod: META_INSTAGRAM_APP_SECRET.
  Meta__Instagram__AppSecret: "#{META_INSTAGRAM_APP_SECRET}#"
  # Spec 2026-10-15 (Shopify): el client secret de la app canjea el code del OAuth y firma cada webhook (HMAC-SHA256). Variable
  # secreta del grupo Backend-prod: SHOPIFY_APP_CLIENT_SECRET. Sin ella el token llega literal y ShopifyAppOptionsValidator deja
  # el pod en crash-loop, a propósito: arrancar con el literal rechazaría la firma de todos los webhooks y Shopify los
  # reintentaría hasta retirar las suscripciones. El webhook se verifica con un solo secreto: al rotarlo en Shopify, las
  # entregas firmadas con el viejo se rechazan desde que arranca el pod con el nuevo (README § Integración con Shopify).
  Shopify__App__ClientSecret: "#{SHOPIFY_APP_CLIENT_SECRET}#"
  Storage__R2__AccessKeyId: "#{STORAGE_R2_ACCESS_KEY_ID}#"
  Storage__R2__SecretAccessKey: "#{STORAGE_R2_SECRET_ACCESS_KEY}#"
  # Spec 2026-11-03 (Tienda pública): StoreOptionsValidator exige las dos en Production con ValidateOnStart, aunque el
  # storefront no esté desplegado: sin ellas el pod no arranca. Variables secretas del grupo Backend-prod:
  # STORE_STOREFRONT_SHARED_SECRET (aleatoria, 32+ caracteres; el storefront manda el mismo valor como QEP_STOREFRONT_KEY,
  # copia en la bóveda del owner) y STORE_TURNSTILE_SECRET_KEY (Secret Key del widget de Cloudflare Turnstile para
  # lulocrm.com). Ojo: el validador no trata #{…}# como ausente, así que si la variable falta en el grupo el pod arranca
  # con el token literal y la tienda rechaza toda llamada.
  Store__Storefront__SharedSecret: "#{STORE_STOREFRONT_SHARED_SECRET}#"
  Store__Turnstile__SecretKey: "#{STORE_TURNSTILE_SECRET_KEY}#"
