kind: Service
apiVersion: v1
metadata:
  name: qep-backend
  namespace: prod-qep-backend
  labels:
    app.kubernetes.io/name: qep-backend
    app.kubernetes.io/part-of: qep
    app.kubernetes.io/environment: prod
spec:
  type: ClusterIP
  selector:
    app: qep-backend
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: http
