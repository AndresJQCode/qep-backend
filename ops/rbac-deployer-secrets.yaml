# Permiso para que el agente de Azure DevOps aplique k8s/prod-secret.yaml.
#
# Sin esto el deploy corta con:
#   Error from server (Forbidden): ... secrets "qep-backend-secret" is forbidden:
#   User "system:serviceaccount:azure-devops-agent:azure-devops-agent" cannot get
#   resource "secrets" in API group "" in the namespace "prod-qep-backend"
#
# Falla en el `get` que `kubectl apply` hace antes de decidir entre crear y parchear, así
# que no alcanza con dar `create`.
#
# ESTO NO LO APLICA EL PIPELINE. La misma service account tampoco puede crear Roles, y por
# eso este archivo vive en ops/ y no en k8s/: lo aplica alguien con admin del clúster, una
# vez, con su propio kubeconfig.
#
#   kubectl apply -f ops/rbac-deployer-secrets.yaml
#
# ANTES DE APLICARLO: preguntar a devops si ya existe un Role que le da a esta SA acceso a
# configmaps y deployments en este namespace — tiene que existir, porque esos sí se aplican
# hoy. Si existe, lo correcto es agregarle estas dos reglas y NO crear un Role paralelo.
# Dos Roles sobre el mismo sujeto y el mismo recurso son una fuente de sorpresas: los
# permisos se suman, así que restringir después uno de los dos no restringe nada.
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: qep-backend-deployer-secrets
  namespace: prod-qep-backend
  labels:
    app.kubernetes.io/name: qep-backend
    app.kubernetes.io/part-of: qep
    app.kubernetes.io/environment: prod
rules:
  # `create` no admite resourceNames: la autorización ocurre antes de que exista el objeto,
  # así que el nombre todavía no es un dato con el que decidir. Es la regla ancha de las dos
  # y no hay forma de acotarla más por RBAC.
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create"]
  # Lectura y modificación acotadas a este Secret y sólo a este. Es lo que evita que un
  # agente de CI comprometido pueda leer cualquier otro Secret del namespace. `get` es el
  # que hoy falta; `patch` y `update` son los que usa `apply` cuando el objeto ya existe.
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["qep-backend-secret"]
    verbs: ["get", "patch", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: qep-backend-deployer-secrets
  namespace: prod-qep-backend
  labels:
    app.kubernetes.io/name: qep-backend
    app.kubernetes.io/part-of: qep
    app.kubernetes.io/environment: prod
subjects:
  - kind: ServiceAccount
    name: azure-devops-agent
    namespace: azure-devops-agent
roleRef:
  kind: Role
  name: qep-backend-deployer-secrets
  apiGroup: rbac.authorization.k8s.io
